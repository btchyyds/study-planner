databases:
  - name: study-db
    databaseName: study_planner
    plan: free

services:
  - type: webService
    name: study-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --preload -w 1 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: study-db
          property: connectionString
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "60"
      - key: CORS_ORIGINS
        sync: false
